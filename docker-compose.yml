services:
  db:
    image: postgres:18
    container_name: macrodesk-postgres
    environment:
      POSTGRES_USER: macrodesk
      POSTGRES_PASSWORD: devroot
      POSTGRES_DB: macrodesk
    ports:
      # Local development only.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 stores data in a versioned subdirectory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrodesk -d macrodesk"]
      interval: 5s
      retries: 12

volumes:
  pgdata:
