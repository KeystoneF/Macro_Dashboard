# Set both public service URLs before the first build.
# API_ORIGIN: https://macrodesk-api.onrender.com
# ALLOWED_ORIGINS: https://macrodesk-web.onrender.com
databases:
  - name: macrodesk-db
    databaseName: macrodesk
    user: macrodesk
    postgresMajorVersion: "18"
    plan: basic-256mb

services:
  - type: web
    name: macrodesk-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    preDeployCommand: npm run migrate
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: macrodesk-db
          property: connectionString
      # Render's internal database endpoint uses a self-signed certificate.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: KEYSTOCKS_API_KEY
        sync: false
      - key: KEYSTOCKS_BASE_URL
        value: http://52.54.224.232
      - key: OPEN_AI_KEY
        sync: false

  - type: web
    name: macrodesk-web
    runtime: node
    rootDir: frontend
    plan: starter
    # The build needs TypeScript and type packages from devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: API_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
