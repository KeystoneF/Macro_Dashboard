<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyStone MacroDesk</title>
<style>
  :root{
    --bg:#1B2530; --panel:#2E4151; --line:#475C6F;
    --ink:#E8EDF1; --ink-dim:#93A6B5;
    --accent:#1AA897; --accent-lt:#5FD8C6;
    --serif:"Times New Roman",Times,serif;
    --mono:Cambria,"Hoefler Text",Constantia,Georgia,serif;
    --sans:Cambria,"Hoefler Text",Constantia,Georgia,serif;
  }
    *{box-sizing:border-box}
  table, .val, .value, .num, .src, .impact{font-variant-numeric:tabular-nums;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;padding:40px;
    overflow:hidden;
  }

  /* soft colour fields behind the glass, this is what the blur has to refract */
  .amb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
  .amb.r1{width:560px;height:560px;background:rgba(26,168,151,.20);top:4%;left:2%;}
  .amb.r2{width:520px;height:520px;background:rgba(18,137,123,.26);top:-120px;right:6%;}
  .amb.t1{width:480px;height:480px;background:rgba(95,216,198,.16);bottom:-150px;right:14%;}
  .amb.g1{width:300px;height:300px;background:rgba(71,92,111,.40);bottom:8%;left:20%;}

  .stage{
    position:relative;z-index:1;width:100%;max-width:980px;
    display:grid;grid-template-columns:1fr .8fr;gap:56px;align-items:center;
  }

  /* left: identity */
  .idBlock{min-width:0;}
  .markRow{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
  .mark{width:34px;height:33px;color:var(--accent);flex-shrink:0;}
  .markRow .co{font-family:var(--mono);font-size:10px;letter-spacing:.2px;color:var(--ink-dim);}

  .wordmark{font-family:var(--serif);line-height:.96;font-weight:700;font-style:italic;}
  .wordmark .l1{display:block;font-size:clamp(42px,6vw,74px);font-weight:400;letter-spacing:-.5px;color:var(--ink);}

  /* glass wordmark: translucent fill, lit edge, glow bleeding through from behind */
  .wordmark .l2{
    display:block;font-size:clamp(42px,6vw,74px);font-weight:400;letter-spacing:-.5px;
    margin-left:.34em;position:relative;
    color:rgba(26,168,151,.32);
    -webkit-text-stroke:1px rgba(95,216,198,.60);
    text-shadow:
      0 1px 0 rgba(255,255,255,.14),
      0 0 34px rgba(26,168,151,.45),
      0 0 78px rgba(26,168,151,.26);
  }
  .tagline{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.2px;
    color:var(--ink-dim);margin-top:30px;
  }
  .srcline{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin-top:8px;opacity:.75;
  }

  /* right: glass sign-in */
  .glass{
    background:linear-gradient(150deg, rgba(255,255,255,.075), rgba(26,168,151,.07) 58%, rgba(255,255,255,.03));
    backdrop-filter:blur(26px) saturate(165%);
    -webkit-backdrop-filter:blur(26px) saturate(165%);
    border:1px solid rgba(255,255,255,.13);
    border-radius:16px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      inset 0 -1px 0 rgba(0,0,0,.20),
      0 26px 70px rgba(0,0,0,.55);
    padding:34px 32px 30px;
  }
  .glass h1{font-family:var(--serif);font-size:23px;font-weight:700;font-style:italic;margin:0 0 24px;}
  .glass .sub{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--ink-dim);margin-bottom:26px;}

  .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
  .field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.2px;color:var(--ink-dim);}
  .field input{
    background:rgba(15,22,30,.46);
    border:1px solid rgba(255,255,255,.11);
    border-radius:8px;color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:12px 13px;
    transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .field input::placeholder{color:rgba(147,166,181,.55);}
  .field input:focus{
    outline:none;background:rgba(15,22,30,.64);
    border-color:rgba(26,168,151,.70);
    box-shadow:0 0 0 3px rgba(26,168,151,.16);
  }

  .rowBetween{display:flex;justify-content:space-between;align-items:center;margin:20px 0 22px;}
  .remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);cursor:pointer;}
  .remember input{accent-color:var(--accent);width:14px;height:14px;}
  .link{font-family:var(--mono);font-size:10.5px;color:var(--accent-lt);text-decoration:none;letter-spacing:.2px;}
  .link:hover{text-decoration:underline;}

  .signin{
    width:100%;background:linear-gradient(160deg,var(--accent-lt),var(--accent));color:var(--bg);border:none;border-radius:999px;
    font-family:var(--mono);font-size:12px;letter-spacing:.2px;
    padding:14px;cursor:pointer;font-weight:600;
    transition:filter .18s, transform .06s;
  }
  .signin:hover{filter:brightness(1.08);}
  .signin:active{transform:translateY(1px);}

  .foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09);
    font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:.2px;line-height:1.7;}
  .foot b{color:var(--accent);font-weight:500;}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr;gap:44px;}
    body{overflow:auto;align-items:flex-start;padding:56px 28px;}
  }
</style>
</head>
<body>

  <div class="amb r1"></div>
  <div class="amb r2"></div>
  <div class="amb t1"></div>
  <div class="amb g1"></div>

  <div class="stage">

    <div class="idBlock">
      <div class="markRow">
        <svg class="mark" viewBox="0 0 160 155" xmlns="http://www.w3.org/2000/svg" aria-label="KeyStone"><path fill="currentColor" fill-rule="evenodd" d="M15.0 154.3C15.0 152.7 57.3 90.1 58.1 90.6C58.5 90.8 63.1 97.2 68.1 104.8C73.2 112.3 82.7 126.2 89.2 135.7C95.7 145.1 101.0 153.3 101.0 153.9C101.0 154.7 88.2 155.0 58.0 155.0C34.3 155.0 15.0 154.7 15.0 154.3ZM114.8 149.1C112.4 145.8 106.5 137.2 101.5 129.9C96.5 122.5 86.8 108.0 79.7 97.6C71.2 84.9 67.1 78.1 67.5 77.0C67.8 76.0 70.4 71.9 73.3 67.8C76.2 63.8 80.5 57.5 82.9 53.8C85.4 50.1 87.7 47.3 88.1 47.6C88.8 48.0 94.9 56.9 131.5 111.5C145.1 131.8 157.1 149.6 158.1 150.9C159.2 152.2 159.7 153.6 159.4 154.1C159.1 154.6 149.9 155.0 139.0 155.0L119.0 155.0L114.8 149.1ZM-0.0 116.3L-0.0 80.1L26.2 40.1L52.5 0.0L77.2 0.0L102.0 0.0L98.2 5.8C94.1 12.1 42.7 89.0 39.9 93.0C39.0 94.4 30.0 107.9 20.0 123.0C10.0 138.1 1.4 150.9 0.9 151.4C0.4 152.0 -0.0 137.5 -0.0 116.3ZM106.9 49.8C101.3 42.0 96.7 35.1 96.7 34.5C96.7 33.8 101.3 25.8 107.0 16.6L117.3 -0.0L138.7 -0.0C150.4 -0.0 160.0 0.2 160.0 0.5C160.0 0.8 156.5 6.3 152.2 12.8C147.9 19.2 138.6 33.4 131.5 44.2C124.3 55.1 118.2 64.0 117.8 64.0C117.5 64.0 112.5 57.6 106.9 49.8ZM-0.0 27.6L0.0 0.0L19.1 0.0L38.1 0.0L36.2 2.8C35.2 4.3 27.4 15.6 19.0 28.0C10.5 40.4 2.8 51.6 1.8 52.9C0.0 55.2 -0.0 54.6 -0.0 27.6Z"/></svg>
      </div>

      <div class="wordmark">
        <span class="l1">KeyStone</span>
        <span class="l2">MacroDesk</span>
      </div>
    </div>

    <div class="glass">
      <h1>Sign in</h1>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="name@company.com" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <div class="rowBetween">
        <label class="remember"><input type="checkbox"> Keep me signed in</label>
        <a class="link" href="#">Forgot password</a>
      </div>

      <button class="signin" onclick="location.href='0-shell.html'">Sign in</button>
    </div>

  </div>
</body>
</html>
